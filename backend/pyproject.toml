[project]
name = "pdv-backend"
version = "0.1.0"
description = "Local-first POS backend bootstrap"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "fastapi>=0.115.12,<1.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pydantic-settings>=2.9.1,<3.0.0",
    "sqlalchemy>=2.0.41,<3.0.0",
    "uvicorn[standard]>=0.34.2,<1.0.0",
]

[project.scripts]
pdv-local-server = "app.local_server:main"
pdv-local-support = "app.support_cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-asyncio>=0.26.0,<1.0.0",
    "ruff>=0.11.10,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
