[project]
name = "pdv-backend"
version = "0.1.0"
description = "Local-first point-of-sale backend built with FastAPI and SQLite"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Emanoel Pedro" }]
license = "MIT"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "python-multipart>=0.0.31,<1.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "sqlalchemy>=2.0.41,<3.0.0",
    "uvicorn[standard]>=0.34.2,<1.0.0",
]

[project.scripts]
pdv-local-server = "app.local_server:main"
pdv-local-support = "app.support_cli:main"

[project.urls]
Repository = "https://github.com/EmanoelPedro/pdv-erp"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.11.10,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
